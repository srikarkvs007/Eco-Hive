server {
    listen 80;
    server_name localhost;

    # Root folder containing the built static React assets
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for high-performance asset loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Route all requests to index.html so React Router handles the navigation page rendering
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static images and media files for optimization
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Cache CSS and JS bundles
    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Error handling fallbacks
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
